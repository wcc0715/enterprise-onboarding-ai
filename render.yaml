services:
  - type: web
    name: enterprise-onboarding-ai
    runtime: python
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir scripts web_service:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile /dev/null
    healthCheckPath: /healthz
    envVars:
      - key: ENABLE_CLOUD
        value: "false"
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: CLOUD_REQUESTS_PER_HOUR
        value: "30"
