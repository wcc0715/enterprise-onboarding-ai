<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企業新進人員 AI 知識助理</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><aside><div class="brand">知識助理 <span>模擬正式版</span></div><h2>新進同仁的制度查詢入口</h2><p>以公司提供的規章為依據，保留例外與來源。</p><label for="mode">查詢範圍</label><select id="mode"><option value="active">模擬正式規章 · ACTIVE</option><option value="draft">草案測試 · 未發布</option></select><p id="scope" class="notice">載入規章狀態中…</p><div class="boundary"><strong>回答邊界</strong><p>未知資訊向已確認的負責單位詢問。沒有串接 HRM，不提供個人餘額或薪資資料。</p><p>模擬企業制度，尚未全部法律審查。</p></div><button id="clear" class="secondary">清除這次對話</button></aside><main><header><div><small>ENTERPRISE ONBOARDING</small><h1>企業新進人員 AI 知識助理</h1></div><span class="local">● 僅限本機</span></header><section id="messages" aria-live="polite" aria-label="聊天訊息"><article class="welcome"><h2>嗨，我是你的小助理！</h2><p>請假、設備或其他公司制度有疑問，都可以先問我。我會幫你整理重點；不清楚的地方，會和你確認或引導你向負責單位詢問。可接續最近六次提問辨識主題；先前對話不作為規章或核准依據。</p><div class="examples"><button data-question="特休一定要提前三天申請嗎？">特休如何申請？</button><button data-question="我還有幾天特休？">查詢特休餘額</button><button data-question="教育訓練一年補助多少錢？">訓練補助上限</button></div></article></section><form id="chat"><label class="sr" for="question">輸入問題</label><textarea id="question" rows="2" maxlength="1000" placeholder="輸入你的問題，例如：忘記打卡要怎麼辦？" required></textarea><button id="send" type="submit">送出問題 ↗</button></form><footer>模擬企業制度 · 依規章回答並附來源 · 不保存聊天紀錄</footer></main></body></html>
